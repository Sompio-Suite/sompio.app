[package]
name = "sompio"
version = "0.4.0"
description = "Sompio Suite: offline privacy tools."
edition = "2021"

[lib]
name = "sompio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sompio-clean = { path = "../../clean" }
sompio-connect = { path = "../../connect" }
sompio-licence = { path = "../../licence" }
sompio-suite = { path = "../../suite" }
sompio-calendar = { path = "../../calendar" }
sompio-vault = { path = "../../vault" }
enigo = "0.6"
arboard = "3"
ureq = "3"
active-win-pos-rs = "0.9"
tauri-plugin-global-shortcut = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
zeroize = "1"
ed25519-dalek = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# SQLite with built-in encryption (SQLite3 Multiple Ciphers), no OpenSSL needed.
[patch.crates-io]
libsqlite3-sys = { path = "../../vendor/libsqlite3-sys" }
