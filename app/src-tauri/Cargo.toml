[package]
name = "sompio"
version = "0.1.0"
description = "Sompio Suite: offline privacy tools."
edition = "2021"

[lib]
name = "sompio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sompio-clean = { path = "../../clean" }
sompio-connect = { path = "../../connect" }
sompio-licence = { path = "../../licence" }
sompio-suite = { path = "../../suite" }
zeroize = "1"
ed25519-dalek = "2"
tokio = { version = "1", features = ["sync"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# SQLite with built-in encryption (SQLite3 Multiple Ciphers), no OpenSSL needed.
[patch.crates-io]
libsqlite3-sys = { path = "../../vendor/libsqlite3-sys" }
