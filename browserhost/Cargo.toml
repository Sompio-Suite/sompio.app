[package]
name = "sompio-browser-host"
version = "0.9.0"
edition = "2021"
description = "Passes messages between the Sompio browser extension and the Sompio app on this PC"
license = "Proprietary"

[lib]
name = "sompio_browser_host"
path = "src/lib.rs"

[[bin]]
name = "sompio-browser"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
