[package]
name = "veil-connect"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
grammers-client = "0.11.0"
grammers-session = { version = "0.11.0", default-features = false, features = ["serde"] }
grammers-mtsender = "0.11.0"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
veil-core = { version = "0.1.0", path = "../core" }
