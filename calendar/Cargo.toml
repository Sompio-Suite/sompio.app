[package]
name = "sompio-calendar"
version = "0.1.0"
edition = "2021"
description = "Sompio Calendar: the Desk Reminders schedule format, a day's reminders, and what pops up when."

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
csv = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# SQLite with built-in encryption (SQLite3 Multiple Ciphers), no OpenSSL needed.
[patch.crates-io]
libsqlite3-sys = { path = "../vendor/libsqlite3-sys" }
