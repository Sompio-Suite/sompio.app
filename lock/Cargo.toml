[package]
name = "sompio-lock"
version = "0.1.0"
edition = "2021"
description = "The Sompio Lock: master password plus key picture (or YubiKey later), and a recovery code."

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.2"
hkdf = "0.13.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
