[package]
name = "sompio-vault"
version = "0.1.0"
edition = "2021"
description = "Sompio Vault: passwords in the KeePass (KDBX 4) format, under the Sompio Lock."

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
csv = "1"
eff-wordlist = "1"
keepass = { version = "0.17", features = ["save_kdbx4", "totp", "_merge"] }
sha1 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
zxcvbn = "3"
argon2 = { package = "rust-argon2", version = "3" }

[dev-dependencies]
tempfile = "3"
