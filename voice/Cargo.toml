[package]
name = "sompio-voice"
version = "0.1.0"
edition = "2021"
description = "Sompio Voice: a self-hosted voice server with channels (like TeamSpeak) and the client side."

[[bin]]
name = "sompio-voice-server"
path = "src/bin/server.rs"

[dependencies]
anyhow = "1"
bytes = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
igd-next = { version = "0.16", features = ["aio_tokio"] }
quinn = "0.11"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "fs"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
