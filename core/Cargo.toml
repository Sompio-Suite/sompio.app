[package]
name = "veil-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
