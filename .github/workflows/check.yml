# Checks that the Windows, Mac and Linux builds still compile and the tests pass, on every push to master.
# Publishes nothing: that's the Publish workflow, on the release branch.
name: Check

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
          cache-on-failure: true
      - name: Build the screens
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit -p .
          npx vite build
      - name: Compile for Windows
        working-directory: app/src-tauri
        shell: bash
        run: |
          # The browser helper is built separately when publishing; a placeholder is enough to check
          mkdir -p binaries && touch binaries/sompio-browser-x86_64-pc-windows-msvc.exe
          cargo check --locked
      - name: Trace tests
        working-directory: clean
        run: cargo test

  mac-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
          cache-on-failure: true
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libxdo-dev
      - name: Build the screens
        working-directory: app
        run: |
          npm ci
          npx vite build
      - name: Compile
        working-directory: app/src-tauri
        run: |
          mkdir -p binaries
          T=$(rustc -vV | sed -n 's/^host: //p')
          touch "binaries/sompio-browser-$T" && chmod +x "binaries/sompio-browser-$T"
          cargo check --locked
