# Builds Veil for Windows on every push, and on demand from the Actions tab.
# The finished installer and portable .exe appear as a download under the run's "Artifacts".
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            connect -> target
      - name: Run engine tests
        working-directory: core
        run: cargo test
      - name: Run connector tests
        working-directory: connect
        run: cargo test

  windows:
    name: Build Windows app
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install interface packages
        working-directory: app
        run: npm ci
      - name: Build installer and app
        working-directory: app
        run: npx tauri build
        env:
          # Veil's own Telegram app key, from the repository's secrets (Settings > Secrets > Actions).
          VEIL_TG_API_ID: ${{ secrets.VEIL_TG_API_ID }}
          VEIL_TG_API_HASH: ${{ secrets.VEIL_TG_API_HASH }}
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item app/src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item app/src-tauri/target/release/bundle/msi/*.msi out/
          Copy-Item app/src-tauri/target/release/veil.exe out/Veil-portable.exe
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: Veil-windows
          path: out/*
          if-no-files-found: error
