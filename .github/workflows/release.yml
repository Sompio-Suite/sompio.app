# Publishing a version: push a tag like v0.1.0 (or run this from the Actions tab).
# GitHub builds the Windows installer and creates a draft release with it attached.
# Review the draft on the Releases page, then press Publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Check the licence key is yours
        shell: bash
        run: |
          if grep -q "2b51fbc64627099647befc32bd63bddd1d74be5de905d795b4c95e5d784777f3" licence/public.key; then
            echo "::error::licence/public.key is still the development key, so this build would refuse every key you make. Run Build Sompio.bat once on your PC, then commit and push licence/public.key."
            exit 1
          fi
      - name: Check updates are set up
        shell: bash
        run: |
          if grep -q "SET_UP_UPDATES_FIRST" app/src-tauri/tauri.release.conf.json; then
            echo "::error::Updates aren't set up yet. Run 'Set up updates.bat' once on your PC, then commit and push app/src-tauri/tauri.release.conf.json."
            exit 1
          fi
      - name: Install interface packages
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          # Releases can go to a separate public repository (vars RELEASES_OWNER / RELEASES_REPO, secret
          # RELEASES_TOKEN), so the code can stay private while the app can still fetch updates.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          SOMPIO_TG_API_ID: ${{ secrets.SOMPIO_TG_API_ID }}
          SOMPIO_TG_API_HASH: ${{ secrets.SOMPIO_TG_API_HASH }}
        with:
          projectPath: app
          # Published releases switch updates on; local builds leave them off.
          args: --config src-tauri/tauri.release.conf.json
          owner: ${{ vars.RELEASES_OWNER || github.repository_owner }}
          repo: ${{ vars.RELEASES_REPO || github.event.repository.name }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: v__VERSION__
          releaseName: Sompio v__VERSION__
          releaseDraft: true
          releaseBody: |
            Already using Sompio? It offers this update by itself: look for **Update now** in the sidebar.

            New here? Download the file ending in **x64-setup.exe** below and run it.

            Windows may show "Windows protected your PC" because the app isn't code-signed yet. Click **More info**, then **Run anyway**.
