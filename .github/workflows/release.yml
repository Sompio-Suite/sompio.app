# Publishes a new Sompio version: builds the Windows installer in the cloud and puts it on sompio.org,
# where testers download it and installed copies offer it under "Update now".
#
# Runs when the "release" branch is pushed (or from the Actions tab: "Run workflow"). The version is the
# one in app/src-tauri/tauri.conf.json; sompio.org refuses a version that isn't newer. What's new goes in
# app/release-notes.txt.
#
# Secrets (Settings > Secrets and variables > Actions), all made by "Set up updates.bat":
#   TAURI_SIGNING_PRIVATE_KEY  signs the update, so Sompio only installs ours
#   SOMPIO_PUBLISH_TOKEN       lets this build upload to sompio.org (same as publish_token in config.php)
#   SOMPIO_UPDATE_TOKEN        built into the app, so sompio.org gives updates only to Sompio (= update_token)
# Optional: SOMPIO_TG_API_ID, SOMPIO_TG_API_HASH (Sompio's own Telegram app key).
name: Publish

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

# Only what the steps need: reading the code, and adding a release note with the checksum
permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            browserhost -> target
          # Keep what was compiled even when a later step fails, so the next run is quick
          cache-on-failure: true
      - name: Check the licence key is yours
        shell: bash
        run: |
          if grep -q "2b51fbc64627099647befc32bd63bddd1d74be5de905d795b4c95e5d784777f3" licence/public.key; then
            echo "::error::licence/public.key is still the development key, so this build would refuse every key you make."
            exit 1
          fi
      - name: Check updates are set up
        shell: bash
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          P: ${{ secrets.SOMPIO_PUBLISH_TOKEN }}
          U: ${{ secrets.SOMPIO_UPDATE_TOKEN }}
        run: |
          if grep -q "SET_UP_UPDATES_FIRST" app/src-tauri/tauri.release.conf.json; then
            echo "::error::Updates aren't set up yet: run 'Set up updates.bat' and send the result."; exit 1
          fi
          if [ -z "$K" ] || [ -z "$P" ] || [ -z "$U" ]; then
            echo "::error::A secret is missing. Add TAURI_SIGNING_PRIVATE_KEY, SOMPIO_PUBLISH_TOKEN and SOMPIO_UPDATE_TOKEN."; exit 1
          fi
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Tidy the secrets
        shell: bash
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          P: ${{ secrets.SOMPIO_PUBLISH_TOKEN }}
          U: ${{ secrets.SOMPIO_UPDATE_TOKEN }}
        run: |
          # A value pasted from Notepad can carry a line break or spaces; the key and codes never contain any
          k=$(printf '%s' "$K" | tr -d ' \r\n\t'); p=$(printf '%s' "$P" | tr -d ' \r\n\t'); u=$(printf '%s' "$U" | tr -d ' \r\n\t')
          echo "::add-mask::$k"; echo "::add-mask::$p"; echo "::add-mask::$u"
          { echo "SIGN_KEY=$k"; echo "PUBLISH_TOKEN=$p"; echo "UPDATE_TOKEN=$u"; } >> "$GITHUB_ENV"
      - name: Build the browser extension helper
        working-directory: browserhost
        shell: bash
        run: |
          cargo build --release
          mkdir -p ../app/src-tauri/binaries
          cp target/release/sompio-browser.exe ../app/src-tauri/binaries/sompio-browser-x86_64-pc-windows-msvc.exe
      - name: Install interface packages
        working-directory: app
        run: npm ci
      - name: Build the installer
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.SIGN_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          SOMPIO_UPDATE_TOKEN: ${{ env.UPDATE_TOKEN }}
          SOMPIO_TG_API_ID: ${{ secrets.SOMPIO_TG_API_ID }}
          SOMPIO_TG_API_HASH: ${{ secrets.SOMPIO_TG_API_HASH }}
      - uses: actions/upload-artifact@v4
        with:
          name: Sompio-${{ env.VERSION }}
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 3
      - name: Put it on sompio.org
        shell: bash
        env:
          TOKEN: ${{ env.PUBLISH_TOKEN }}
        run: |
          EXE="app/src-tauri/target/release/bundle/nsis/Sompio_${VERSION}_x64-setup.exe"
          ls -la "$EXE" "$EXE.sig"
          NOTES=$(cat app/release-notes.txt 2>/dev/null || echo "")
          code=$(curl -sS --retry 2 -o reply.txt -w '%{http_code}' -X POST https://sompio.org/publish.php \
            -H "X-Sompio-Publish: $TOKEN" -A "Sompio-Publish" \
            -F "setup=@$EXE" -F "version=$VERSION" -F "signature=$(cat "$EXE.sig")" -F "notes=$NOTES")
          cat reply.txt
          # 409: this version is already on sompio.org (a rebuild without a version change), which is fine
          if [ "$code" != "200" ] && [ "$code" != "409" ]; then echo "::error::sompio.org answered $code"; exit 1; fi
          # Only a version that's new on sompio.org gets announced
          if [ "$code" = "200" ]; then echo "NEW_VERSION=1" >> "$GITHUB_ENV"; fi

      - name: Put the checksum on GitHub
        # A second, independent place to check the installer against: if sompio.org were ever
        # tampered with, its download wouldn't match this. The installer itself isn't attached.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE="app/src-tauri/target/release/bundle/nsis/Sompio_${VERSION}_x64-setup.exe"
          SUM=$(sha256sum "$EXE" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          if gh release view "v$VERSION" > /dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 0; fi
          {
            cat app/release-notes.txt 2>/dev/null || true
            echo
            echo "---"
            echo
            echo "**Installer:** \`Sompio_${VERSION}_x64-setup.exe\`, available to testers on [sompio.org](https://sompio.org/tester.php)."
            echo
            echo "**SHA-256:** \`$SUM\`"
            echo
            echo "The tester portal shows the same fingerprint next to the download. If they ever differ, don't install it, and write to hello@sompio.org."
          } > release-body.md
          gh release create "v$VERSION" --title "Sompio $VERSION" --notes-file release-body.md --target "$GITHUB_SHA"

      - name: Announce it on Discord
        # Posts the release notes to the channel behind the DISCORD_WEBHOOK secret. Without that secret,
        # or when this version was already on sompio.org, nothing is posted.
        if: env.NEW_VERSION == '1'
        shell: bash
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          HOOK=$(printf '%s' "$HOOK" | tr -d ' \r\n\t')
          if [ -z "$HOOK" ]; then echo "No DISCORD_WEBHOOK secret: skipping the announcement"; exit 0; fi
          echo "::add-mask::$HOOK"
          python - <<'PY' > discord.json
          import json, os
          version = os.environ["VERSION"]
          try:
              notes = open("app/release-notes.txt", encoding="utf-8").read().strip()
          except OSError:
              notes = ""
          lines = [l.strip() for l in notes.splitlines() if l.strip()]
          body = "\n".join("\u2022 " + l for l in lines) or "Bug fixes and improvements."
          body += "\n\nOpen Sompio and click **Update now**, or get it from the [tester portal](https://sompio.org/tester.php)."
          print(json.dumps({
              "username": "Sompio",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": f"Sompio {version} is out",
                  "url": f"https://github.com/Sompio-Suite/sompio.org/releases/tag/v{version}",
                  "description": body[:4000],
                  "color": 0x2E7D32,
              }],
          }))
          PY
          code=$(curl -sS -o reply.txt -w '%{http_code}' -H "Content-Type: application/json" --data @discord.json "$HOOK")
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then cat reply.txt; echo "::warning::Discord answered $code; the release itself is fine"; fi
